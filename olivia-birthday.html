<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olivia's Birthday Countdown!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap');

:root{
  --pink:#FF6FA5;
  --pink-deep:#E0367B;
  --purple:#9B5DE5;
  --blue:#3FC1E9;
  --yellow:#FFC93C;
  --mint:#2EE6A6;
  --ink:#3A2E4D;
  --paper:#FFFFFF;
}
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  min-height:100vh;
  font-family:'Quicksand',Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,#FFE1EE 0%,#FFF3D6 45%,#DFF6FF 100%);
  overflow-x:hidden;
  position:relative;
}
h1,h2,h3{ font-family:'Baloo 2', cursive; margin:0; }

/* floating balloons/confetti background */
.bg-deco{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.balloon{
  position:absolute; bottom:-160px; width:60px; height:76px; border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  opacity:.85; animation:float linear infinite;
}
.balloon::after{
  content:''; position:absolute; left:50%; top:100%; width:2px; height:70px; background:rgba(58,46,77,.25);
  transform:translateX(-50%);
}
.balloon::before{
  content:''; position:absolute; left:50%; bottom:-10px; width:0; height:0; transform:translateX(-50%);
  border-left:6px solid transparent; border-right:6px solid transparent; border-top:10px solid inherit;
}
@keyframes float{
  0%{ transform:translateY(0) translateX(0) rotate(-4deg); }
  50%{ transform:translateY(-55vh) translateX(30px) rotate(4deg); }
  100%{ transform:translateY(-115vh) translateX(-20px) rotate(-4deg); }
}

.confetti{
  position:absolute; top:-20px; width:9px; height:14px; opacity:.9;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{ transform:translateY(0) rotate(0deg); opacity:0; }
  8%{ opacity:.9; }
  100%{ transform:translateY(110vh) rotate(360deg); opacity:.9; }
}

.wrap{
  position:relative; z-index:1;
  max-width:780px; margin:0 auto; padding:48px 20px 70px;
  text-align:center;
}

.eyebrow{
  display:inline-block; font-weight:700; letter-spacing:1.5px; text-transform:uppercase;
  font-size:13px; color:var(--pink-deep); background:#fff; border:2px dashed var(--pink);
  border-radius:999px; padding:6px 18px; margin-bottom:18px;
}

.title{
  font-size:clamp(34px,7vw,64px); font-weight:800; line-height:1.05;
  background:linear-gradient(90deg,var(--pink) 0%,var(--purple) 50%,var(--blue) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:6px;
}
.subtitle{
  font-size:clamp(16px,3vw,22px); font-weight:600; color:var(--ink); opacity:.85; margin-bottom:34px;
}
.subtitle b{ color:var(--pink-deep); }

.photo-frame{
  width:180px; height:180px; margin:0 auto 30px; border-radius:50%;
  background:var(--paper); border:6px solid #fff;
  box-shadow:0 0 0 6px var(--yellow), 0 14px 30px rgba(155,93,229,.25);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  position:relative;
}
.photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo-frame .placeholder{
  font-size:70px; line-height:1;
}

.countdown{
  display:flex; flex-wrap:wrap; justify-content:center; gap:14px; margin:0 auto 30px;
}
.unit{
  background:var(--paper); border-radius:20px; padding:18px 10px;
  width:110px; box-shadow:0 10px 24px rgba(155,93,229,.18);
  border:3px solid var(--purple);
}
.unit:nth-child(2){ border-color:var(--pink); }
.unit:nth-child(3){ border-color:var(--blue); }
.unit:nth-child(4){ border-color:var(--mint); }
.unit .num{
  font-family:'Baloo 2', cursive; font-weight:800; font-size:clamp(30px,7vw,44px);
  color:var(--ink); line-height:1; font-variant-numeric:tabular-nums;
}
.unit .label{
  margin-top:6px; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--purple);
}
.unit:nth-child(2) .label{ color:var(--pink-deep); }
.unit:nth-child(3) .label{ color:#1592b8; }
.unit:nth-child(4) .label{ color:#1aa87e; }

.datebox{
  display:inline-block; margin-top:6px; font-weight:700; font-size:15px;
  background:#fff; border:2px solid var(--yellow); border-radius:999px; padding:8px 20px; color:var(--ink);
}

.party{
  display:none; margin-top:10px;
}
.party.show{ display:block; }
.party h2{
  font-size:clamp(30px,7vw,52px);
  background:linear-gradient(90deg,var(--pink) 0%,var(--yellow) 50%,var(--mint) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:8px;
}
.party p{ font-weight:700; font-size:18px; }

.footer-note{
  margin-top:40px; font-size:13px; color:var(--ink); opacity:.55;
}
</style>
</head>
<body>

<div class="bg-deco" id="bgDeco"></div>

<div class="wrap">
  <div class="eyebrow">🎉 Countdown Time 🎉</div>
  <h1 class="title">Olivia's Birthday!</h1>
  <p class="subtitle">Counting down to <b>Olivia's 6th Birthday</b> 🎂</p>

  <div class="photo-frame" id="photoFrame">
    <!--
      To add Olivia's photo: put an image file named "olivia.jpg"
      in the same folder as this page, then reload.
    -->
    <div class="placeholder">🦄</div>
  </div>

  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="days">--</div><div class="label">Days</div></div>
    <div class="unit"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
    <div class="unit"><div class="num" id="minutes">--</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="num" id="seconds">--</div><div class="label">Seconds</div></div>
  </div>

  <div class="datebox" id="dateLabel">until September 26th 🎈</div>

  <div class="party" id="partyMsg">
    <h2>🎊 HAPPY BIRTHDAY OLIVIA! 🎊</h2>
    <p>She's officially 6 years old today! 🎁🦄🎂</p>
  </div>

  <div class="footer-note">Made with love for Olivia 💗</div>
</div>

<script>
// Olivia turns 6 on the first Sept 26 on/after her 6th-birthday year.
// Countdown always targets the next upcoming September 26th, and the
// age shown updates automatically each year.
const BIRTH_YEAR = 2020; // Olivia was born in 2020 -> turns 6 on Sept 26, 2026

function nextBirthday(){
  const now = new Date();
  let year = now.getFullYear();
  let target = new Date(year, 8, 26, 0, 0, 0); // month 8 = September
  if (target < now) {
    target = new Date(year + 1, 8, 26, 0, 0, 0);
  }
  return target;
}

function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function updateAgeLabel(target){
  const age = target.getFullYear() - BIRTH_YEAR;
  document.querySelector('.subtitle b').textContent = `Olivia's ${ordinal(age)} Birthday`;
}

function tick(){
  const target = nextBirthday();
  updateAgeLabel(target);
  const now = new Date();
  const diff = target - now;

  if (diff <= 0){
    document.getElementById('countdown').style.display = 'none';
    document.getElementById('dateLabel').style.display = 'none';
    document.getElementById('partyMsg').classList.add('show');
    return;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById('days').textContent = d;
  document.getElementById('hours').textContent = String(h).padStart(2,'0');
  document.getElementById('minutes').textContent = String(m).padStart(2,'0');
  document.getElementById('seconds').textContent = String(s).padStart(2,'0');
}
tick();
setInterval(tick, 1000);

// Photo: try to load olivia.jpg; fall back to placeholder emoji if missing.
(function loadPhoto(){
  const img = new Image();
  img.onload = function(){
    const frame = document.getElementById('photoFrame');
    frame.innerHTML = '';
    frame.appendChild(img);
  };
  img.onerror = function(){ /* keep placeholder */ };
  img.src = 'olivia.jpg';
})();

// Floating balloons + confetti background
(function deco(){
  const container = document.getElementById('bgDeco');
  const colors = ['#FF6FA5','#9B5DE5','#3FC1E9','#FFC93C','#2EE6A6'];

  for (let i = 0; i < 9; i++){
    const b = document.createElement('div');
    b.className = 'balloon';
    const color = colors[i % colors.length];
    b.style.background = color;
    b.style.borderTopColor = color;
    b.style.left = (Math.random() * 96) + 'vw';
    b.style.animationDuration = (14 + Math.random() * 10) + 's';
    b.style.animationDelay = (-Math.random() * 20) + 's';
    container.appendChild(b);
  }

  for (let i = 0; i < 40; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (5 + Math.random() * 6) + 's';
    c.style.animationDelay = (-Math.random() * 10) + 's';
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    container.appendChild(c);
  }
})();
</script>

</body>
</html>
